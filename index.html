<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>NÜVY · Villa Juárez</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;touch-action:manipulation}
body{
  background:#fff8fb;color:#29252a;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
button,input,select{touch-action:manipulation}
input,select{
  width:100%;padding:15px;border:1px solid #eee5ea;border-radius:15px;
  background:#fff;color:#29252a;outline:0;
}
input:focus,select:focus{border-color:#c978a5}
.app{min-height:100vh;padding-bottom:82px}
.hidden{display:none!important}

header{
  height:72px;padding:12px 18px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;
  background:rgba(255,248,251,.95);
  border-bottom:1px solid #eee5ea;
  backdrop-filter:blur(15px);
}
.brand{font-weight:900;font-size:25px;letter-spacing:3px}
.brand small{display:block;font-size:9px;letter-spacing:1px;color:#8c858c}
.employee-button{
  background:#f8e7f0;border-radius:16px;padding:8px 13px;
  text-align:right;color:#a95f8d;
}
.employee-button span{display:block;font-size:10px;color:#8c858c}
.employee-button b{font-size:13px}

main{max-width:1100px;margin:auto;padding:24px 17px}
h1{font-size:30px;margin:4px 0 7px}
h2{font-size:21px;margin:0 0 17px}
.subtitle{color:#8c858c;margin:0 0 23px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{
  background:#fff;border:1px solid #eee5ea;border-radius:23px;
  padding:19px;box-shadow:0 5px 20px rgba(70,30,50,.045)
}
.menu-card{min-height:128px;text-align:left}
.menu-card:active{transform:scale(.98)}
.menu-card .icon{font-size:30px;margin-bottom:13px}
.menu-card b{display:block;font-size:16px}
.menu-card span{font-size:12px;color:#8c858c}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:20px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:17px;border-radius:19px;background:#f8e7f0}
.stat span{font-size:11px;color:#8c858c}
.stat strong{display:block;font-size:21px;margin-top:5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
label{display:block;font-size:12px;color:#8c858c;margin:14px 0 7px}
.primary{
  width:100%;padding:17px;border-radius:17px;
  background:#c978a5;color:white;font-weight:800;font-size:17px;
}
.secondary{
  padding:12px 15px;border-radius:14px;background:#f8e7f0;
  color:#a95f8d;font-weight:700;
}
.danger{background:#fde8e9;color:#c95660}
.weight{
  text-align:center;font-size:54px;font-weight:900;
  padding:22px;background:#f8e7f0;border-radius:24px;margin:16px 0;
}
.total{text-align:center;font-size:39px;font-weight:900;margin:18px 0}
.payment-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pay{
  padding:16px 5px;border-radius:16px;background:white;
  border:1px solid #eee5ea;font-weight:700;
}
.pay.active{border:2px solid #c978a5;background:#f8e7f0;color:#a95f8d}
.change-box{
  margin-top:14px;padding:18px;border-radius:18px;background:#f1f8f5;
}
.change-box strong{font-size:27px;color:#43856b}
.table{width:100%;border-collapse:collapse}
.table th,.table td{
  padding:12px 6px;border-bottom:1px solid #eee5ea;
  text-align:left;font-size:12px;
}
.table th{color:#8c858c}
.badge{
  display:inline-block;padding:5px 9px;border-radius:20px;
  background:#f8e7f0;color:#a95f8d;font-size:10px;font-weight:700;
}
.empty{text-align:center;padding:32px;color:#8c858c}

.bottom{
  position:fixed;left:0;right:0;bottom:0;height:73px;
  background:white;border-top:1px solid #eee5ea;z-index:30;
  display:flex;justify-content:center;padding:7px;gap:4px;
}
.nav{
  flex:1;max-width:135px;background:none;border-radius:17px;
  color:#8c858c;font-size:10px;
}
.nav div{font-size:21px}
.nav.active{background:#f8e7f0;color:#a95f8d;font-weight:700}

.pin-screen{
  position:fixed;inset:0;z-index:100;background:#fff8fb;
  display:flex;align-items:center;justify-content:center;
  padding:20px;touch-action:manipulation;
}
.pin-box{width:100%;max-width:420px;text-align:center}
.logo{
  width:82px;height:82px;border-radius:50%;margin:0 auto 17px;
  background:#f8e7f0;color:#a95f8d;
  display:grid;place-items:center;font-size:25px;font-weight:900;
}
.employee-select{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}
.emp{
  padding:15px;border-radius:16px;background:white;
  border:1px solid #eee5ea;
}
.emp.active{border:2px solid #c978a5;background:#f8e7f0}
.pin-dots{height:45px;font-size:25px;letter-spacing:7px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.key{
  height:62px;border-radius:17px;background:#fff;
  border:1px solid #eee5ea;font-size:21px;font-weight:700;
}
.key:active{background:#f8e7f0}
.modal{
  position:fixed;inset:0;background:rgba(30,20,25,.42);
  z-index:80;display:none;align-items:flex-end;
}
.modal.show{display:flex}
.modal-box{
  width:100%;max-width:560px;margin:auto;
  background:#fff;border-radius:27px 27px 0 0;
  padding:24px;max-height:92vh;overflow:auto;
}
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  z-index:200;background:#29252a;color:white;
  padding:12px 18px;border-radius:30px;font-size:12px;
  display:none;white-space:nowrap;
}
.toast.show{display:block}
.status{
  font-size:10px;padding:5px 9px;border-radius:20px;
  background:#eef7f2;color:#43856b;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="pin-screen">
  <div class="pin-box">
    <div class="logo">N</div>
    <div class="brand">NÜVY</div>
    <p class="subtitle">Villa Juárez</p>

    <div id="employeeSelect" class="employee-select"></div>

    <div id="pinDots" class="pin-dots">○ ○ ○ ○</div>

    <div class="keypad">
      <button class="key" onclick="pressPin(1)">1</button>
      <button class="key" onclick="pressPin(2)">2</button>
      <button class="key" onclick="pressPin(3)">3</button>
      <button class="key" onclick="pressPin(4)">4</button>
      <button class="key" onclick="pressPin(5)">5</button>
      <button class="key" onclick="pressPin(6)">6</button>
      <button class="key" onclick="pressPin(7)">7</button>
      <button class="key" onclick="pressPin(8)">8</button>
      <button class="key" onclick="pressPin(9)">9</button>
      <button class="key" onclick="backPin()">⌫</button>
      <button class="key" onclick="pressPin(0)">0</button>
      <button class="key" onclick="login()">✓</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">

<header>
  <div>
    <div class="brand">NÜVY</div>
    <small>VILLA JUÁREZ</small>
  </div>

  <button class="employee-button" onclick="switchEmployee()">
    <span>Cobrando ahora</span>
    <b id="currentEmployee">—</b>
  </button>
</header>

<main id="content"></main>

<nav class="bottom">
  <button class="nav active" onclick="go('home',this)">
    <div>⌂</div>Inicio
  </button>
  <button class="nav" onclick="go('sale',this)">
    <div>＋</div>Venta
  </button>
  <button class="nav" onclick="go('inventory',this)">
    <div>▣</div>Inventario
  </button>
  <button class="nav" onclick="go('cash',this)">
    <div>＄</div>Caja
  </button>
  <button class="nav" onclick="go('reports',this)">
    <div>◒</div>Reportes
  </button>
</nav>

</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div id="modalBox" class="modal-box"></div>
</div>

<div id="toast" class="toast"></div>

<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  query,
  orderBy,
  serverTimestamp,
  initializeFirestore,
  persistentLocalCache,
  persistentMultipleTabManager
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyA_WDLvZiRSdlsOugdG-lVc2G5FBxe2EbM",
  authDomain:"nuvy-villa-juarez.firebaseapp.com",
  projectId:"nuvy-villa-juarez",
  storageBucket:"nuvy-villa-juarez.firebasestorage.app",
  messagingSenderId:"392959821616",
  appId:"1:392959821616:web:89f2650762fdfecccd6af5"
};

const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);

let db;

try{
  db=initializeFirestore(firebaseApp,{
    localCache:persistentLocalCache({
      tabManager:persistentMultipleTabManager()
    })
  });
}catch(e){
  db=getFirestore(firebaseApp);
}

/* =========================================================
   ESTADO
========================================================= */

let employees=[];
let currentEmployee=null;
let selectedEmployee=null;
let pin="";
let page="home";

let sale={
  grams:"",
  payment:"Efectivo",
  received:"",
  status:"draft"
};

let settings={
  pricePerGram:0.40,
  businessName:"Nüvy Villa Juárez"
};

let sales=[];
let inventory=[];
let cashClosings=[];

/* =========================================================
   UTILIDADES
========================================================= */

const $=id=>document.getElementById(id);

function money(n){
  return "$"+Number(n||0).toFixed(2);
}

function today(){
  return new Date().toLocaleDateString("en-CA");
}

function timeNow(){
  return new Date().toLocaleTimeString("es-MX",{
    hour:"2-digit",minute:"2-digit"
  });
}

function uid(prefix="NV"){
  return prefix+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,7);
}

function toast(message){
  $("toast").textContent=message;
  $("toast").classList.add("show");
  setTimeout(()=>$("toast").classList.remove("show"),2200);
}

function isOwner(){
  return currentEmployee?.role==="Owner";
}

function requireOwner(){
  if(!isOwner()){
    toast("Solo Owner puede hacer esto");
    return false;
  }
  return true;
}

/* =========================================================
   FIRESTORE CARGA
========================================================= */

async function loadData(){

  try{

    const settingsSnap=await getDoc(
      doc(db,"settings","main")
    );

    if(settingsSnap.exists()){
      settings={
        ...settings,
        ...settingsSnap.data()
      };
    }else{
      await setDoc(doc(db,"settings","main"),settings);
    }

    const empSnap=await getDocs(collection(db,"employees"));

    employees=empSnap.docs.map(d=>({
      id:d.id,
      ...d.data()
    }));

    if(!employees.length){
      /*
        DEMO INICIAL.
        Estos usuarios son temporales.
        Los datos definitivos deberán configurarse
        mediante Authentication + reglas.
      */
      employees=[
        {
          id:"ramon",
          name:"Ramón",
          role:"Owner",
          email:"",
          pin:"1234",
          active:true
        },
        {
          id:"itzel",
          name:"Itzel",
          role:"Owner",
          email:"",
          pin:"5678",
          active:true
        },
        {
          id:"empleado1",
          name:"Empleado 1",
          role:"Empleado",
          email:"",
          pin:"1111",
          active:true
        },
        {
          id:"empleado2",
          name:"Empleado 2",
          role:"Empleado",
          email:"",
          pin:"2222",
          active:true
        }
      ];

      for(const e of employees){
        await setDoc(
          doc(db,"employees",e.id),
          e
        );
      }
    }

    const salesSnap=await getDocs(
      query(
        collection(db,"sales"),
        orderBy("createdAt","desc")
      )
    );

    sales=salesSnap.docs.map(d=>({
      id:d.id,
      ...d.data()
    }));

    const invSnap=await getDocs(
      collection(db,"inventory")
    );

    inventory=invSnap.docs.map(d=>({
      id:d.id,
      ...d.data()
    }));

    const cashSnap=await getDocs(
      collection(db,"cashClosings")
    );

    cashClosings=cashSnap.docs.map(d=>({
      id:d.id,
      ...d.data()
    }));

  }catch(error){

    console.error(error);

    /*
      Si Firebase todavía tiene las reglas cerradas,
      la interfaz sigue arrancando para que podamos
      continuar desarrollando.
    */

    employees=[
      {id:"ramon",name:"Ramón",role:"Owner",pin:"1234",active:true},
      {id:"itzel",name:"Itzel",role:"Owner",pin:"5678",active:true},
      {id:"empleado1",name:"Empleado 1",role:"Empleado",pin:"1111",active:true},
      {id:"empleado2",name:"Empleado 2",role:"Empleado",pin:"2222",active:true}
    ];

    sales=[];
    inventory=[];
    cashClosings=[];

    toast("Modo local: Firebase aún no permite lectura");
  }

  renderEmployees();
}

/* =========================================================
   GUARDAR EN FIRESTORE
========================================================= */

async function saveSale(s){

  try{
    await setDoc(
      doc(db,"sales",s.id),
      {
        ...s,
        createdAt:serverTimestamp()
      }
    );
  }catch(e){
    console.error("saveSale",e);
    toast("Guardada localmente; pendiente de sincronizar");
  }

}

async function saveInventoryItem(item){

  try{
    await setDoc(
      doc(db,"inventory",item.id),
      item
    );
  }catch(e){
    console.error(e);
  }

}

async function saveEmployee(e){

  try{
    await setDoc(
      doc(db,"employees",e.id),
      e
    );
  }catch(error){
    console.error(error);
    toast("No se pudo guardar en Firebase");
  }

}

async function saveSettings(){

  try{
    await setDoc(
      doc(db,"settings","main"),
      settings
    );
  }catch(e){
    console.error(e);
  }

}

/* =========================================================
   LOGIN
========================================================= */

function renderEmployees(){

  const active=employees.filter(e=>e.active!==false);

  $("employeeSelect").innerHTML=active.map(e=>`
    <button class="emp ${selectedEmployee?.id===e.id?"active":""}"
      onclick="selectEmployee('${e.id}')">
      <b>${e.name}</b><br>
      <small>${e.role}</small>
    </button>
  `).join("");

}

window.selectEmployee=id=>{

  selectedEmployee=employees.find(e=>e.id===id);
  pin="";
  updatePin();
  renderEmployees();

};

window.pressPin=n=>{

  if(!selectedEmployee){
    toast("Selecciona quién está cobrando");
    return;
  }

  if(pin.length<6){
    pin+=String(n);
    updatePin();
  }

};

window.backPin=()=>{
  pin=pin.slice(0,-1);
  updatePin();
};

function updatePin(){

  $("pinDots").textContent=
    pin.length
    ? Array.from(pin).map(()=> "●").join(" ")
    : "○ ○ ○ ○";

}

/*
  Login visual.
  El PIN se sustituirá por la autenticación segura
  asociada a Firebase antes de producción.
*/

window.login=async()=>{

  if(!selectedEmployee)
    return toast("Selecciona un empleado");

  if(pin===String(selectedEmployee.pin)){

    currentEmployee=selectedEmployee;

    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");

    $("currentEmployee").textContent=currentEmployee.name;

    page="home";
    render();

  }else{

    pin="";
    updatePin();
    toast("PIN incorrecto");

  }

};

window.switchEmployee=()=>{

  currentEmployee=null;
  selectedEmployee=null;
  pin="";
  updatePin();

  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");

  renderEmployees();

};

/* =========================================================
   NAVEGACIÓN
========================================================= */

window.go=(p,button)=>{

  page=p;

  document.querySelectorAll(".nav")
    .forEach(x=>x.classList.remove("active"));

  if(button)button.classList.add("active");

  render();

};

function render(){

  if(page==="home")home();
  if(page==="sale")salePage();
  if(page==="inventory")inventoryPage();
  if(page==="cash")cashPage();
  if(page==="reports")reportsPage();
  if(page==="employees")employeesPage();
  if(page==="settings")settingsPage();

}

/* =========================================================
   HOME
========================================================= */

function home(){

  const todaySales=sales.filter(
    s=>s.date===today()&&!s.cancelled
  );

  const total=todaySales.reduce(
    (a,b)=>a+Number(b.total||0),0
  );

  const grams=todaySales.reduce(
    (a,b)=>a+Number(b.grams||0),0
  );

  $("content").innerHTML=`

    <h1>Hola, ${currentEmployee.name} 👋</h1>
    <p class="subtitle">¿Qué quieres hacer hoy?</p>

    <div class="stats">

      <div class="stat">
        <span>Ventas hoy</span>
        <strong>${money(total)}</strong>
      </div>

      <div class="stat">
        <span>Tickets</span>
        <strong>${todaySales.length}</strong>
      </div>

      <div class="stat">
        <span>Gramos</span>
        <strong>${grams} g</strong>
      </div>

      <div class="stat">
        <span>Estado</span>
        <strong>${navigator.onLine?"Online":"Offline"}</strong>
      </div>

    </div>

    <div class="grid">

      <button class="card menu-card" onclick="go('sale')">
        <div class="icon">🧾</div>
        <b>Nueva venta</b>
        <span>Cobrar por gramos</span>
      </button>

      <button class="card menu-card" onclick="go('inventory')">
        <div class="icon">📦</div>
        <b>Inventario</b>
        <span>Existencias físicas</span>
      </button>

      <button class="card menu-card" onclick="go('cash')">
        <div class="icon">💵</div>
        <b>Caja</b>
        <span>Corte del día</span>
      </button>

      <button class="card menu-card" onclick="go('reports')">
        <div class="icon">📊</div>
        <b>Reportes</b>
        <span>Historial de ventas</span>
      </button>

      ${isOwner()?`

      <button class="card menu-card" onclick="go('employees')">
        <div class="icon">👥</div>
        <b>Empleados</b>
        <span>Usuarios y permisos</span>
      </button>

      <button class="card menu-card" onclick="go('settings')">
        <div class="icon">⚙️</div>
        <b>Configuración</b>
        <span>Solo Owner</span>
      </button>

      `:""}

    </div>
  `;

}

/* =========================================================
   VENTA
========================================================= */

function salePage(){

  const grams=Number(sale.grams)||0;
  const total=grams*Number(settings.pricePerGram||0);

  let paymentArea="";

  if(sale.payment==="Efectivo"){

    const received=Number(sale.received)||0;
    const change=received-total;

    paymentArea=`

      <label>¿Cuánto entrega el cliente?</label>

      <input
        id="cashReceived"
        type="number"
        inputmode="decimal"
        step="0.01"
        placeholder="${total.toFixed(2)}"
        value="${sale.received}"
        oninput="updateReceived(this.value)"
      >

      ${received>0?`

      <div class="change-box">

        <div>
          ${change>=0
            ?"Cambio a devolver"
            :"Faltan por pagar"}
        </div>

        <strong>
          ${money(Math.abs(change))}
        </strong>

      </div>

      `:""}

    `;

  }

  $("content").innerHTML=`

    <h1>Nueva venta</h1>
    <p class="subtitle">
      La venta se calcula exclusivamente por gramos.
    </p>

    <div class="card">

      <label>Peso en gramos</label>

      <input
        id="gramsInput"
        type="number"
        inputmode="decimal"
        step="0.01"
        placeholder="Ej. 213"
        value="${sale.grams}"
      >

      <div class="weight">
        <span id="weightDisplay">${grams}</span> g
      </div>

      <div class="total" id="saleTotal">
        ${money(total)}
      </div>

      <div class="row">
        <span style="color:#8c858c;font-size:12px">
          Precio por gramo
        </span>
        <b>${money(settings.pricePerGram)}</b>
      </div>

      <label>Método de pago</label>

      <div class="payment-grid">

        ${["Efectivo","Tarjeta","Apple Pay"].map(p=>`

          <button
            class="pay ${sale.payment===p?"active":""}"
            onclick="setPayment('${p}')">

            ${p==="Efectivo"?"💵":p==="Tarjeta"?"💳":""}

            <br>${p}

          </button>

        `).join("")}

      </div>

      ${paymentArea}

      <br>

      <button class="primary" onclick="chargeSale()">
        COBRAR ${money(total)}
      </button>

    </div>

    <div class="card" style="margin-top:14px">

      <div class="row">

        <span style="font-size:12px;color:#8c858c">
          Estado
        </span>

        <span class="badge">
          Venta pendiente
        </span>

      </div>

      <p style="font-size:12px;color:#8c858c">
        Puedes modificar el peso y el método de pago
        mientras la venta no haya sido cobrada.
      </p>

    </div>

  `;

  const input=$("gramsInput");

  input.addEventListener("input",()=>{
    sale.grams=input.value;
    updateSaleDisplay();
  });

}

function updateSaleDisplay(){

  const grams=Number(sale.grams)||0;
  const total=grams*Number(settings.pricePerGram||0);

  if($("weightDisplay"))
    $("weightDisplay").textContent=grams;

  if($("saleTotal"))
    $("saleTotal").textContent=money(total);

}

window.setPayment=p=>{

  sale.payment=p;

  if(p!=="Efectivo")
    sale.received="";

  salePage();

};

window.updateReceived=value=>{

  sale.received=value;

  const total=(Number(sale.grams)||0)*settings.pricePerGram;

  const received=Number(value)||0;
  const change=received-total;

  /*
    Actualización visual sin reconstruir toda la pantalla.
  */

  const box=document.querySelector(".change-box");

  if(box){

    box.innerHTML=`

      <div>
        ${change>=0
          ?"Cambio a devolver"
          :"Faltan por pagar"}
      </div>

      <strong>${money(Math.abs(change))}</strong>

    `;

  }

};

window.chargeSale=async()=>{

  const grams=Number(sale.grams)||0;

  if(grams<=0)
    return toast("Introduce el peso");

  const total=grams*settings.pricePerGram;

  if(sale.payment==="Efectivo"){

    const received=Number(sale.received)||0;

    if(received<total){
      return toast("El efectivo no alcanza para cobrar");
    }

  }

  const saleId=uid("NV");

  const newSale={

    id:saleId,
    date:today(),
    time:timeNow(),

    grams,
    pricePerGram:settings.pricePerGram,
    total,

    payment:sale.payment,
    received:
      sale.payment==="Efectivo"
      ?Number(sale.received)
      :total,

    change:
      sale.payment==="Efectivo"
      ?Number(sale.received)-total
      :0,

    employeeId:currentEmployee.id,
    employee:currentEmployee.name,

    status:"PAID",
    cancelled:false,

    createdAt:new Date().toISOString()

  };

  sales.unshift(newSale);

  await saveSale(newSale);

  sale={
    grams:"",
    payment:"Efectivo",
    received:"",
    status:"draft"
  };

  toast("Venta cobrada ✓");

  setTimeout(()=>go("home"),400);

};

function cashPage(){

  const todaySales=sales.filter(
    s=>s.date===today()&&!s.cancelled
  );

  const cash=todaySales
    .filter(s=>s.payment==="Efectivo")
    .reduce((a,b)=>a+Number(b.total||0),0);

  const card=todaySales
    .filter(s=>s.payment==="Tarjeta")
    .reduce((a,b)=>a+Number(b.total||0),0);

  const apple=todaySales
    .filter(s=>s.payment==="Apple Pay")
    .reduce((a,b)=>a+Number(b.total||0),0);

  const total=cash+card+apple;

  $("content").innerHTML=`

    <h1>Caja</h1>

    <p class="subtitle">
      Corte del día ${today()}
    </p>

    <div class="stats">

      <div class="stat">
        <span>Total</span>
        <strong>${money(total)}</strong>
      </div>

      <div class="stat">
        <span>Efectivo esperado</span>
        <strong>${money(cash)}</strong>
      </div>

      <div class="stat">
        <span>Tarjeta</span>
        <strong>${money(card)}</strong>
      </div>

      <div class="stat">
        <span>Apple Pay</span>
        <strong>${money(apple)}</strong>
      </div>

    </div>

    <div class="card">

      <h2>Corte de caja</h2>

      <p class="subtitle">
        ${todaySales.length
          ?`${todaySales.length} venta(s) registradas.`
          :"Todavía no hay ventas. El corte comenzará en $0.00."}
      </p>

      <label>Efectivo contado físicamente</label>

      <input
        id="cashReal"
        type="number"
        inputmode="decimal"
        step="0.01"
        placeholder="0.00"
      >

      <br><br>

      <button class="primary" onclick="closeCash(${cash})">
        CERRAR CAJA
      </button>

    </div>

  `;

}

window.closeCash=async expected=>{

  if(!currentEmployee)
    return toast("No hay empleado activo");

  const real=Number($("cashReal").value);

  if(!Number.isFinite(real)||real<0)
    return toast("Introduce el efectivo contado");

  const closing={
    id:uid("CORTE"),
    date:today(),
    time:timeNow(),
    expected:Number(expected),
    real,
    difference:real-Number(expected),
    employeeId:currentEmployee.id,
    employee:currentEmployee.name
  };

  cashClosings.unshift(closing);

  try{

    await setDoc(
      doc(db,"cashClosings",closing.id),
      closing
    );

  }catch(e){

    console.error(e);
    toast("Corte guardado localmente");

  }

  toast(
    closing.difference===0
      ?"Corte correcto ✓"
      :"Corte guardado"
  );

};

window.addEmployee=async()=>{

  if(!requireOwner())return;

  const name=$("empName").value.trim();
  const email=$("empEmail").value.trim();
  const p=$("empPin").value.trim();
  const role=$("empRole").value;

  if(!name)
    return toast("Falta el nombre");

  if(!/^\\d{4,6}$/.test(p))
    return toast("El PIN debe tener 4 a 6 números");

  const employee={
    id:uid("EMP"),
    name,
    email,
    pin:p,
    role,
    active:true
  };

  employees.push(employee);

  await saveEmployee(employee);

  closeModal();
  employeesPage();

  toast("Empleado creado ✓");

};

window.editEmployee=id=>{

  if(!requireOwner())return;

  const e=employees.find(x=>x.id===id);

  if(!e)return;

  $("modalBox").innerHTML=`

    <h2>Editar empleado</h2>

    <label>Nombre</label>

    <input id="editName" value="${e.name}">

    <label>Correo</label>

    <input id="editEmail" value="${e.email||""}">

    <label>PIN</label>

    <input
      id="editPin"
      type="password"
      inputmode="numeric"
      maxlength="6"
      value="${e.pin||""}"
    >

    <label>Rol</label>

    <select id="editRole">

      <option
        value="Empleado"
        ${e.role==="Empleado"?"selected":""}>
        Empleado
      </option>

      <option
        value="Owner"
        ${e.role==="Owner"?"selected":""}>
        Owner
      </option>

    </select>

    <br><br>

    <button
      class="primary"
      onclick="updateEmployee('${id}')">
      GUARDAR CAMBIOS
    </button>

    <br><br>

    <button
      class="secondary danger"
      onclick="toggleEmployee('${id}')">
      ${e.active===false?"Activar empleado":"Desactivar empleado"}
    </button>

  `;

  openModal();

};

window.updateEmployee=async id=>{

  if(!requireOwner())return;

  const e=employees.find(x=>x.id===id);

  if(!e)return;

  const name=$("editName").value.trim();
  const email=$("editEmail").value.trim();
  const p=$("editPin").value.trim();
  const role=$("editRole").value;

  if(!name)
    return toast("Falta el nombre");

  if(!/^\\d{4,6}$/.test(p))
    return toast("PIN inválido");

  e.name=name;
  e.email=email;
  e.pin=p;
  e.role=role;

  await saveEmployee(e);

  closeModal();
  employeesPage();

  toast("Empleado actualizado ✓");

};

window.toggleEmployee=async id=>{

  if(!requireOwner())return;

  const e=employees.find(x=>x.id===id);

  if(!e)return;

  e.active=e.active===false;

  await saveEmployee(e);

  closeModal();
  employeesPage();

  toast(e.active?"Empleado activado":"Empleado desactivado");

};

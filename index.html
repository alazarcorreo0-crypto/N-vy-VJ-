<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<title>NÜVY · Villa Juárez</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#fff8fb;--card:#fff;--text:#29252a;--muted:#8c858c;
  --primary:#c978a5;--primary2:#a95f8d;--soft:#f8e7f0;
  --green:#62a88b;--red:#d96b72;--line:#eee5ea;
}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}
button,input,select{font:inherit}
button{border:0;cursor:pointer}
.app{min-height:100vh;padding-bottom:82px}
header{
  height:72px;padding:14px 22px;display:flex;align-items:center;
  justify-content:space-between;background:rgba(255,248,251,.94);
  position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);
  backdrop-filter:blur(15px)
}
.brand{font-weight:900;font-size:25px;letter-spacing:3px}
.brand small{display:block;font-size:9px;letter-spacing:1px;color:var(--muted);font-weight:600}
.employee-top{font-size:12px;color:var(--muted);text-align:right}
.employee-top b{display:block;color:var(--text);font-size:14px}
main{max-width:1100px;margin:auto;padding:24px 18px}
h1{font-size:30px;margin:5px 0 8px}
h2{font-size:22px;margin:0 0 18px}
.subtitle{color:var(--muted);margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:24px;
  padding:20px;box-shadow:0 5px 20px rgba(70,30,50,.04)
}
.menu-card{min-height:130px;text-align:left;transition:.15s}
.menu-card:active{transform:scale(.97)}
.menu-card .icon{font-size:31px;margin-bottom:15px}
.menu-card b{font-size:17px;display:block}
.menu-card span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:18px;border-radius:20px;background:var(--soft)}
.stat span{font-size:12px;color:var(--muted)}
.stat strong{display:block;font-size:23px;margin-top:5px}
.bottom{
  position:fixed;bottom:0;left:0;right:0;height:72px;background:#fff;
  border-top:1px solid var(--line);display:flex;justify-content:center;
  gap:5px;z-index:20;padding:7px
}
.nav{
  flex:1;max-width:130px;background:none;border-radius:18px;color:var(--muted);
  font-size:11px
}
.nav.active{background:var(--soft);color:var(--primary2);font-weight:700}
.nav div{font-size:21px;margin-bottom:2px}
.primary{
  width:100%;padding:17px;border-radius:17px;background:var(--primary);
  color:#fff;font-weight:800;font-size:17px
}
.secondary{
  padding:13px 17px;border-radius:14px;background:var(--soft);
  color:var(--primary2);font-weight:700
}
.danger{background:#fde8e9;color:var(--red)}
input,select{
  width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);
  background:#fff;color:var(--text);outline:none
}
input:focus,select:focus{border-color:var(--primary)}
label{display:block;font-size:12px;color:var(--muted);margin:15px 0 7px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.total{
  font-size:38px;font-weight:900;text-align:center;margin:22px 0
}
.weight{
  font-size:55px;font-weight:900;text-align:center;padding:24px;
  background:var(--soft);border-radius:25px
}
.payment-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pay{
  padding:18px 5px;border-radius:17px;background:#fff;border:1px solid var(--line);
  text-align:center;font-weight:700
}
.pay.active{border:2px solid var(--primary);background:var(--soft);color:var(--primary2)}
.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:13px 7px;border-bottom:1px solid var(--line);font-size:13px}
.table th{color:var(--muted);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:35px}
.badge{padding:5px 9px;border-radius:20px;background:var(--soft);font-size:11px}
.modal{
  position:fixed;inset:0;background:rgba(30,20,25,.42);z-index:50;
  display:none;align-items:flex-end;justify-content:center
}
.modal.show{display:flex}
.modal-box{
  background:#fff;width:100%;max-width:560px;border-radius:28px 28px 0 0;
  padding:25px;max-height:90vh;overflow:auto
}
.pin-screen{
  position:fixed;inset:0;background:var(--bg);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px
}
.pin-box{width:100%;max-width:420px;text-align:center}
.logo{
  width:82px;height:82px;border-radius:50%;margin:0 auto 18px;
  display:grid;place-items:center;background:var(--soft);
  color:var(--primary2);font-size:24px;font-weight:900;letter-spacing:2px
}
.pin-dots{font-size:30px;letter-spacing:8px;height:48px;margin:18px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{
  height:65px;border-radius:18px;background:#fff;border:1px solid var(--line);
  font-size:22px;font-weight:700
}
.key:active{background:var(--soft)}
.employee-select{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}
.emp{
  padding:16px;border-radius:17px;background:#fff;border:1px solid var(--line)
}
.emp.active{border:2px solid var(--primary);background:var(--soft)}
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:#29252a;color:#fff;padding:13px 20px;border-radius:30px;
  z-index:200;display:none;font-size:13px
}
.toast.show{display:block}
.hidden{display:none!important}
</style>
</head>

<body>

<div id="login" class="pin-screen">
  <div class="pin-box">
    <div class="logo">N</div>
    <div class="brand">NÜVY</div>
    <p class="subtitle">Villa Juárez</p>

    <div class="employee-select" id="employeeSelect"></div>

    <div class="pin-dots" id="pinDots">○ ○ ○ ○</div>

    <div class="keypad">
      <button class="key" onclick="key(1)">1</button>
      <button class="key" onclick="key(2)">2</button>
      <button class="key" onclick="key(3)">3</button>
      <button class="key" onclick="key(4)">4</button>
      <button class="key" onclick="key(5)">5</button>
      <button class="key" onclick="key(6)">6</button>
      <button class="key" onclick="key(7)">7</button>
      <button class="key" onclick="key(8)">8</button>
      <button class="key" onclick="key(9)">9</button>
      <button class="key" onclick="clearPin()">⌫</button>
      <button class="key" onclick="key(0)">0</button>
      <button class="key" onclick="login()">✓</button>
    </div>
  </div>
</div>

<div id="app" class="app hidden">
<header>
  <div>
    <div class="brand">NÜVY</div>
    <small>VILLA JUÁREZ</small>
  </div>
  <div class="employee-top">
    <span>Cobrando ahora</span>
    <b id="currentEmployee">—</b>
  </div>
</header>

<main id="content"></main>

<nav class="bottom">
  <button class="nav active" onclick="go('home',this)"><div>⌂</div>Inicio</button>
  <button class="nav" onclick="go('sale',this)"><div>＋</div>Venta</button>
  <button class="nav" onclick="go('inventory',this)"><div>▣</div>Inventario</button>
  <button class="nav" onclick="go('cash',this)"><div>＄</div>Caja</button>
  <button class="nav" onclick="go('reports',this)"><div>◒</div>Reportes</button>
</nav>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modalBox"></div>
</div>

<div id="toast" class="toast"></div>

<script type="module">

/* ================= FIREBASE ================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  enableIndexedDbPersistence
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyA_WDLvZiRSdlsOugdG-lVc2G5FBxe2EbM",
  authDomain:"nuvy-villa-juarez.firebaseapp.com",
  projectId:"nuvy-villa-juarez",
  storageBucket:"nuvy-villa-juarez.firebasestorage.app",
  messagingSenderId:"392959821616",
  appId:"1:392959821616:web:89f2650762fdfecccd6af5"
};

const firebaseApp=initializeApp(firebaseConfig);
const db=getFirestore(firebaseApp);

enableIndexedDbPersistence(db).catch(()=>{});

/* ================= DATOS LOCALES ================= */

const defaultData={
  employees:[
    {id:"ramon",name:"Ramón",role:"Owner",pin:"1234"},
    {id:"itzel",name:"Itzel",role:"Owner",pin:"5678"},
    {id:"empleado1",name:"Empleado 1",role:"Empleado",pin:"1111"},
    {id:"empleado2",name:"Empleado 2",role:"Empleado",pin:"2222"}
  ],
  settings:{
    price100:40,
    business:"Nüvy Villa Juárez"
  },
  sales:[],
  inventory:[],
  cashClosings:[]
};

let data=JSON.parse(localStorage.getItem("nuvyData")||"null")||defaultData;
let currentEmployee=null;
let selectedEmployee=null;
let pin="";
let page="home";
let sale={grams:"",payment:"Efectivo"};

function save(){
  localStorage.setItem("nuvyData",JSON.stringify(data));
}

function money(n){
  return "$"+Number(n||0).toFixed(2);
}

function today(){
  return new Date().toISOString().slice(0,10);
}

function toast(t){
  const e=document.getElementById("toast");
  e.textContent=t;e.classList.add("show");
  setTimeout(()=>e.classList.remove("show"),2200);
}

/* ================= LOGIN ================= */

function renderEmployees(){
  document.getElementById("employeeSelect").innerHTML=data.employees.map(e=>`
    <button class="emp ${selectedEmployee?.id===e.id?"active":""}"
      onclick="selectEmployee('${e.id}')">
      <b>${e.name}</b><br><small>${e.role}</small>
    </button>`).join("");
}

window.selectEmployee=id=>{
  selectedEmployee=data.employees.find(e=>e.id===id);
  pin="";
  updatePin();
  renderEmployees();
};

window.key=n=>{
  if(!selectedEmployee)return toast("Selecciona un empleado");
  if(pin.length<6){pin+=n;updatePin()}
};

window.clearPin=()=>{
  pin=pin.slice(0,-1);updatePin();
};

function updatePin(){
  document.getElementById("pinDots").textContent=
    pin?pin.split("").map(()=> "●").join(" ") : "○ ○ ○ ○";
}

window.login=()=>{
  if(!selectedEmployee)return toast("Selecciona un empleado");
  if(pin===selectedEmployee.pin){
    currentEmployee=selectedEmployee;
    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("currentEmployee").textContent=currentEmployee.name;
    go("home");
  }else{
    pin="";updatePin();toast("PIN incorrecto");
  }
};

/* ================= NAVEGACIÓN ================= */

window.go=(p,button)=>{
  page=p;
  document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
  if(button)button.classList.add("active");
  render();
};

function render(){
  if(page==="home")home();
  if(page==="sale")salePage();
  if(page==="inventory")inventoryPage();
  if(page==="cash")cashPage();
  if(page==="reports")reportsPage();
}

/* ================= INICIO ================= */

function home(){
  const sales=data.sales.filter(x=>x.date===today()&&!x.cancelled);
  const total=sales.reduce((a,b)=>a+b.total,0);
  const grams=sales.reduce((a,b)=>a+b.grams,0);

  document.getElementById("content").innerHTML=`
    <h1>Hola, ${currentEmployee.name} 👋</h1>
    <p class="subtitle">¿Qué quieres hacer hoy?</p>

    <div class="stats">
      <div class="stat"><span>Ventas hoy</span><strong>${money(total)}</strong></div>
      <div class="stat"><span>Tickets</span><strong>${sales.length}</strong></div>
      <div class="stat"><span>Gramos</span><strong>${grams} g</strong></div>
      <div class="stat"><span>Empleado</span><strong>${currentEmployee.name}</strong></div>
    </div>

    <div class="grid">
      <button class="card menu-card" onclick="go('sale')">
        <div class="icon">🧾</div><b>Nueva venta</b><span>Cobrar por gramos</span>
      </button>
      <button class="card menu-card" onclick="go('inventory')">
        <div class="icon">📦</div><b>Inventario</b><span>Existencias físicas</span>
      </button>
      <button class="card menu-card" onclick="go('cash')">
        <div class="icon">💵</div><b>Caja</b><span>Corte del día</span>
      </button>
      <button class="card menu-card" onclick="go('reports')">
        <div class="icon">📊</div><b>Reportes</b><span>Historial y estadísticas</span>
      </button>
      <button class="card menu-card" onclick="employeesPage()">
        <div class="icon">👥</div><b>Empleados</b><span>Usuarios y permisos</span>
      </button>
      <button class="card menu-card" onclick="settingsPage()">
        <div class="icon">⚙️</div><b>Configuración</b><span>Precio y negocio</span>
      </button>
    </div>
  `;
}

/* ================= VENTA ================= */

function salePage(){
  const grams=Number(sale.grams)||0;
  const total=grams*(Number(data.settings.price100)||0)/100;

  document.getElementById("content").innerHTML=`
    <h1>Nueva venta</h1>
    <p class="subtitle">Todo Nüvy se cobra por peso.</p>

    <div class="card">
      <label>Peso</label>
      <input id="gramsInput" type="number" inputmode="decimal"
        placeholder="Ej. 213" value="${sale.grams}"
        oninput="sale.grams=this.value;updateSaleTotal()">

      <div class="weight"><span id="weightDisplay">${grams}</span> g</div>

      <div class="total" id="saleTotal">${money(total)}</div>

      <label>Método de pago</label>
      <div class="payment-grid">
        ${["Efectivo","Tarjeta","Apple Pay"].map(p=>`
          <button class="pay ${sale.payment===p?"active":""}"
            onclick="setPayment('${p}')">
            ${p==="Efectivo"?"💵":p==="Tarjeta"?"💳":""}<br>${p}
          </button>`).join("")}
      </div>

      <br>
      <button class="primary" onclick="finishSale()">COBRAR ${money(total)}</button>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="row">
        <span>Precio configurado</span>
        <b>${money(data.settings.price100)} / 100 g</b>
      </div>
    </div>
  `;
}

window.setPayment=p=>{
  sale.payment=p;render();
};

window.updateSaleTotal=()=>{
  const g=Number(document.getElementById("gramsInput").value)||0;
  sale.grams=g;
  document.getElementById("weightDisplay").textContent=g;
  document.getElementById("saleTotal").textContent=
    money(g*data.settings.price100/100);
};

window.finishSale=()=>{
  const grams=Number(sale.grams);
  if(!grams||grams<=0)return toast("Introduce el peso");

  const total=grams*data.settings.price100/100;

  data.sales.push({
    id:"NV-"+Date.now(),
    date:today(),
    time:new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}),
    grams,total,
    payment:sale.payment,
    employee:currentEmployee.name,
    employeeId:currentEmployee.id,
    cancelled:false
  });

  save();
  toast("Venta registrada ✓");
  sale={grams:"",payment:"Efectivo"};
  setTimeout(()=>go("home"),400);
};

/* ================= INVENTARIO ================= */

function inventoryPage(){
  document.getElementById("content").innerHTML=`
    <div class="row">
      <div><h1>Inventario</h1><p class="subtitle">Control físico de existencias.</p></div>
      <button class="secondary" onclick="inventoryModal()">＋ Agregar</button>
    </div>

    <div class="card">
      ${data.inventory.length?`
      <table class="table">
        <thead><tr><th>Artículo</th><th>Unidad</th><th>Inicio</th><th>Actual</th></tr></thead>
        <tbody>
        ${data.inventory.map((x,i)=>`
          <tr>
            <td><b>${x.name}</b></td>
            <td>${x.unit}</td>
            <td>${x.start}</td>
            <td><b>${x.current}</b></td>
          </tr>`).join("")}
        </tbody>
      </table>`:`<div class="empty">Todavía no hay artículos.<br>Agrega tu primer producto.</div>`}
    </div>
  `;
}

window.inventoryModal=()=>{
  document.getElementById("modalBox").innerHTML=`
    <h2>Agregar inventario</h2>
    <label>Nombre</label>
    <input id="invName" placeholder="Ej. Galletas Oreo">
    <label>Unidad</label>
    <select id="invUnit">
      <option>Caja</option><option>Pieza</option><option>Batida</option>
      <option>Bolsa</option><option>Botella</option><option>Kg</option>
      <option>Litro</option>
    </select>
    <label>Existencia inicial</label>
    <input id="invStart" type="number" inputmode="decimal">
    <br><br>
    <button class="primary" onclick="addInventory()">Guardar</button>
  `;
  openModal();
};

window.addInventory=()=>{
  const name=document.getElementById("invName").value.trim();
  const unit=document.getElementById("invUnit").value;
  const start=Number(document.getElementById("invStart").value)||0;
  if(!name)return toast("Escribe el nombre");
  data.inventory.push({id:Date.now(),name,unit,start,current:start});
  save();closeModal();inventoryPage();toast("Inventario agregado");
};

/* ================= CAJA ================= */

function cashPage(){
  const sales=data.sales.filter(x=>x.date===today()&&!x.cancelled);
  const cash=sales.filter(x=>x.payment==="Efectivo").reduce((a,b)=>a+b.total,0);
  const card=sales.filter(x=>x.payment==="Tarjeta").reduce((a,b)=>a+b.total,0);
  const apple=sales.filter(x=>x.payment==="Apple Pay").reduce((a,b)=>a+b.total,0);
  const total=cash+card+apple;

  document.getElementById("content").innerHTML=`
    <h1>Caja</h1>
    <p class="subtitle">Corte del día ${today()}</p>

    <div class="stats">
      <div class="stat"><span>Total</span><strong>${money(total)}</strong></div>
      <div class="stat"><span>Efectivo</span><strong>${money(cash)}</strong></div>
      <div class="stat"><span>Tarjeta</span><strong>${money(card)}</strong></div>
      <div class="stat"><span>Apple Pay</span><strong>${money(apple)}</strong></div>
    </div>

    <div class="card">
      <h2>Corte de caja</h2>
      <p class="subtitle">Cuenta físicamente el efectivo y compáralo con lo esperado.</p>
      <label>Efectivo contado</label>
      <input id="cashReal" type="number" inputmode="decimal" placeholder="0.00">
      <br><br>
      <button class="primary" onclick="closeCash(${cash})">CERRAR CAJA</button>
    </div>
  `;
}

window.closeCash=expected=>{
  const real=Number(document.getElementById("cashReal").value);
  if(isNaN(real))return toast("Introduce el efectivo contado");

  data.cashClosings.push({
    date:today(),expected,real,difference:real-expected,
    employee:currentEmployee.name,time:new Date().toLocaleTimeString()
  });

  save();toast("Corte guardado ✓");
};

/* ================= REPORTES ================= */

function reportsPage(){
  const sales=[...data.sales].reverse();

  document.getElementById("content").innerHTML=`
    <h1>Reportes</h1>
    <p class="subtitle">Historial completo de Nüvy.</p>

    <div class="card">
      <h2>Ventas</h2>
      ${sales.length?`
      <table class="table">
        <thead>
          <tr><th>Fecha</th><th>Gramos</th><th>Total</th><th>Pago</th><th>Empleado</th></tr>
        </thead>
        <tbody>
        ${sales.map(x=>`
          <tr style="${x.cancelled?"opacity:.45;text-decoration:line-through":""}">
            <td>${x.date}<br><small>${x.time}</small></td>
            <td>${x.grams} g</td>
            <td>${money(x.total)}</td>
            <td><span class="badge">${x.payment}</span></td>
            <td>${x.employee}</td>
          </tr>`).join("")}
        </tbody>
      </table>`:`<div class="empty">No hay ventas registradas.</div>`}
    </div>
  `;
}

/* ================= EMPLEADOS ================= */

window.employeesPage=()=>{
  document.getElementById("content").innerHTML=`
    <div class="row">
      <div><h1>Empleados</h1><p class="subtitle">Usuarios y permisos.</p></div>
      <button class="secondary" onclick="employeeModal()">＋ Agregar</button>
    </div>

    <div class="grid">
      ${data.employees.map(e=>`
        <div class="card">
          <div class="row">
            <b>${e.name}</b>
            <span class="badge">${e.role}</span>
          </div>
          <p class="subtitle">PIN configurado</p>
          ${e.role!=="Owner"?`
          <button class="secondary danger" onclick="deleteEmployee('${e.id}')">Eliminar</button>`
          :`<span class="badge">Owner</span>`}
        </div>`).join("")}
    </div>
  `;
};

window.employeeModal=()=>{
  document.getElementById("modalBox").innerHTML=`
    <h2>Nuevo empleado</h2>
    <label>Nombre</label>
    <input id="empName" placeholder="Nombre">
    <label>PIN</label>
    <input id="empPin" type="password" inputmode="numeric" maxlength="6" placeholder="4-6 números">
    <br><br>
    <button class="primary" onclick="addEmployee()">Crear empleado</button>
  `;
  openModal();
};

window.addEmployee=()=>{
  const name=document.getElementById("empName").value.trim();
  const p=document.getElementById("empPin").value.trim();
  if(!name||!/^\\d{4,6}$/.test(p))return toast("Nombre y PIN válido requeridos");
  data.employees.push({
    id:"emp"+Date.now(),name,role:"Empleado",pin:p
  });
  save();closeModal();employeesPage();toast("Empleado creado");
};

window.deleteEmployee=id=>{
  if(!confirm("¿Eliminar este empleado?"))return;
  data.employees=data.employees.filter(e=>e.id!==id);
  save();employeesPage();
};

/* ================= CONFIGURACIÓN ================= */

window.settingsPage=()=>{
  document.getElementById("content").innerHTML=`
    <h1>Configuración</h1>
    <p class="subtitle">Configuración general de Nüvy.</p>

    <div class="card">
      <h2>Precio</h2>
      <label>Precio por 100 gramos</label>
      <input id="price100" type="number" inputmode="decimal"
        value="${data.settings.price100}">
      <br><br>
      <button class="primary" onclick="saveSettings()">GUARDAR</button>
    </div>

    <div class="card" style="margin-top:14px">
      <h2>Sesión</h2>
      <button class="secondary" onclick="logout()">Cerrar sesión</button>
    </div>
  `;
};

window.saveSettings=()=>{
  const p=Number(document.getElementById("price100").value);
  if(p<=0)return toast("Precio inválido");
  data.settings.price100=p;
  save();toast("Configuración guardada ✓");
};

window.logout=()=>{
  currentEmployee=null;selectedEmployee=null;pin="";
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  renderEmployees();updatePin();
};

/* ================= MODAL ================= */

function openModal(){document.getElementById("modal").classList.add("show")}
window.closeModal=()=>document.getElementById("modal").classList.remove("show");

/* ================= ARRANQUE ================= */

renderEmployees();
updatePin();

</script>
</body>
</html>

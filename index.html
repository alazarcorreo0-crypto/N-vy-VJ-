<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>NÜVY · Villa Juárez</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;touch-action:manipulation}
body{
  background:#fff8fb;color:#29252a;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
button,input,select{touch-action:manipulation}
input,select{
  width:100%;padding:15px;border:1px solid #eee5ea;border-radius:15px;
  background:#fff;color:#29252a;outline:0;
}
input:focus,select:focus{border-color:#c978a5}
.app{min-height:100vh;padding-bottom:82px}
.hidden{display:none!important}

header{
  height:72px;padding:12px 18px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;
  background:rgba(255,248,251,.95);
  border-bottom:1px solid #eee5ea;
  backdrop-filter:blur(15px);
}
.brand{font-weight:900;font-size:25px;letter-spacing:3px}
.brand-sub{font-size:9px;letter-spacing:1px;color:#8c858c}

.employee-button{
  background:#f8e7f0;border-radius:16px;padding:8px 13px;
  text-align:right;color:#a95f8d;
}
.employee-button span{display:block;font-size:10px;color:#8c858c}
.employee-button b{font-size:13px}

main{max-width:1100px;margin:auto;padding:24px 17px}
h1{font-size:30px;margin:4px 0 7px}
h2{font-size:21px;margin:0 0 17px}
.subtitle{color:#8c858c;margin:0 0 23px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
@media(min-width:700px){
  .grid{grid-template-columns:repeat(4,1fr)}
}

.card{
  background:#fff;border:1px solid #eee5ea;border-radius:23px;
  padding:19px;box-shadow:0 5px 20px rgba(70,30,50,.045)
}
.menu-card{min-height:128px;text-align:left}
.menu-card:active{transform:scale(.98)}
.menu-card .icon{font-size:30px;margin-bottom:13px}
.menu-card b{display:block;font-size:16px}
.menu-card span{font-size:12px;color:#8c858c}

.stats{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:11px;margin-bottom:20px
}
@media(min-width:700px){
  .stats{grid-template-columns:repeat(4,1fr)}
}
.stat{padding:17px;border-radius:19px;background:#f8e7f0}
.stat span{font-size:11px;color:#8c858c}
.stat strong{display:block;font-size:21px;margin-top:5px}

.row{
  display:flex;justify-content:space-between;
  align-items:center;gap:10px
}
label{
  display:block;font-size:12px;color:#8c858c;
  margin:14px 0 7px
}

.primary{
  width:100%;padding:17px;border-radius:17px;
  background:#c978a5;color:white;
  font-weight:800;font-size:17px
}
.primary:disabled{opacity:.55}

.secondary{
  padding:12px 15px;border-radius:14px;
  background:#f8e7f0;color:#a95f8d;font-weight:700
}
.danger{background:#fde8e9;color:#c95660}

.weight{
  text-align:center;font-size:54px;font-weight:900;
  padding:22px;background:#f8e7f0;
  border-radius:24px;margin:16px 0
}

.total{
  text-align:center;font-size:39px;
  font-weight:900;margin:18px 0
}

.payment-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:9px
}
.pay{
  padding:16px 5px;border-radius:16px;background:white;
  border:1px solid #eee5ea;font-weight:700
}
.pay.active{
  border:2px solid #c978a5;
  background:#f8e7f0;color:#a95f8d
}

.change-box{
  margin-top:14px;padding:18px;
  border-radius:18px;background:#f1f8f5
}
.change-box strong{
  font-size:27px;color:#43856b
}

.table{width:100%;border-collapse:collapse}
.table th,.table td{
  padding:12px 6px;border-bottom:1px solid #eee5ea;
  text-align:left;font-size:12px
}
.table th{color:#8c858c}

.badge{
  display:inline-block;padding:5px 9px;
  border-radius:20px;background:#f8e7f0;
  color:#a95f8d;font-size:10px;font-weight:700
}

.empty{
  text-align:center;padding:32px;color:#8c858c
}

.bottom{
  position:fixed;left:0;right:0;bottom:0;height:73px;
  background:white;border-top:1px solid #eee5ea;
  z-index:30;display:flex;justify-content:center;
  padding:7px;gap:4px
}

.nav{
  flex:1;max-width:135px;background:none;
  border-radius:17px;color:#8c858c;font-size:10px
}
.nav div{font-size:21px}
.nav.active{
  background:#f8e7f0;color:#a95f8d;font-weight:700
}

.pin-screen{
  position:fixed;inset:0;z-index:100;
  background:#fff8fb;display:flex;
  align-items:center;justify-content:center;
  padding:20px;touch-action:manipulation
}

.pin-box{width:100%;max-width:420px;text-align:center}

.logo{
  width:82px;height:82px;border-radius:50%;
  margin:0 auto 17px;background:#f8e7f0;
  color:#a95f8d;display:grid;place-items:center;
  font-size:25px;font-weight:900
}

.employee-select{
  display:grid;grid-template-columns:1fr 1fr;
  gap:9px;margin:18px 0
}

.emp{
  padding:15px;border-radius:16px;background:white;
  border:1px solid #eee5ea
}
.emp.active{
  border:2px solid #c978a5;
  background:#f8e7f0
}

.pin-dots{
  height:45px;font-size:25px;letter-spacing:7px
}

.keypad{
  display:grid;grid-template-columns:repeat(3,1fr);gap:9px
}

.key{
  height:62px;border-radius:17px;background:#fff;
  border:1px solid #eee5ea;
  font-size:21px;font-weight:700
}
.key:active{background:#f8e7f0}

.modal{
  position:fixed;inset:0;
  background:rgba(30,20,25,.42);
  z-index:80;display:none;
  align-items:flex-end
}
.modal.show{display:flex}

.modal-box{
  width:100%;max-width:560px;margin:auto;
  background:#fff;border-radius:27px 27px 0 0;
  padding:24px;max-height:92vh;overflow:auto
}

.toast{
  position:fixed;bottom:90px;left:50%;
  transform:translateX(-50%);
  z-index:200;background:#29252a;color:white;
  padding:12px 18px;border-radius:30px;
  font-size:12px;display:none;white-space:nowrap
}
.toast.show{display:block}

.status{
  font-size:10px;padding:5px 9px;
  border-radius:20px;background:#eef7f2;color:#43856b
}

.cloud{
  font-size:10px;padding:5px 9px;
  border-radius:20px;background:#eef7f2;color:#43856b
}
.cloud.off{
  background:#fff1e6;color:#b66a2c
}

.small-note{
  font-size:12px;color:#8c858c
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="login" class="pin-screen">

  <div class="pin-box">

    <div class="logo">N</div>

    <div class="brand">NÜVY</div>

    <p class="subtitle">Villa Juárez</p>

    <div id="cloudStatus" class="cloud">
      Conectando con Firebase…
    </div>

    <div id="employeeSelect" class="employee-select"></div>

    <div id="pinDots" class="pin-dots">
      ○ ○ ○ ○
    </div>

    <div class="keypad">

      <button class="key" onclick="pressPin(1)">1</button>
      <button class="key" onclick="pressPin(2)">2</button>
      <button class="key" onclick="pressPin(3)">3</button>

      <button class="key" onclick="pressPin(4)">4</button>
      <button class="key" onclick="pressPin(5)">5</button>
      <button class="key" onclick="pressPin(6)">6</button>

      <button class="key" onclick="pressPin(7)">7</button>
      <button class="key" onclick="pressPin(8)">8</button>
      <button class="key" onclick="pressPin(9)">9</button>

      <button class="key" onclick="backPin()">⌫</button>
      <button class="key" onclick="pressPin(0)">0</button>
      <button class="key" onclick="login()">✓</button>

    </div>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="app hidden">

<header>

  <div>

    <div class="brand">NÜVY</div>

    <div class="brand-sub">
      VILLA JUÁREZ
    </div>

  </div>

  <button
    class="employee-button"
    onclick="switchEmployee()">

    <span>Cobrando ahora</span>

    <b id="currentEmployee">—</b>

  </button>

</header>


<main id="content"></main>


<nav class="bottom">

  <button
    class="nav active"
    onclick="go('home',this)">

    <div>⌂</div>
    Inicio

  </button>


  <button
    class="nav"
    onclick="go('sale',this)">

    <div>＋</div>
    Venta

  </button>


  <button
    class="nav"
    onclick="go('inventory',this)">

    <div>▣</div>
    Inventario

  </button>


  <button
    class="nav"
    onclick="go('cash',this)">

    <div>＄</div>
    Caja

  </button>


  <button
    class="nav"
    onclick="go('reports',this)">

    <div>◒</div>
    Reportes

  </button>

</nav>

</div>


<div
  id="modal"
  class="modal"
  onclick="if(event.target===this)closeModal()">

  <div
    id="modalBox"
    class="modal-box">
  </div>

</div>


<div id="toast" class="toast"></div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  getDocs,
  query,
  orderBy,
  serverTimestamp,
  initializeFirestore,
  persistentLocalCache,
  persistentMultipleTabManager
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyA_WDLvZiRSdlsOugdG-lVc2G5FBxe2EbM",

  authDomain:
    "nuvy-villa-juarez.firebaseapp.com",

  projectId:
    "nuvy-villa-juarez",

  storageBucket:
    "nuvy-villa-juarez.firebasestorage.app",

  messagingSenderId:
    "392959821616",

  appId:
    "1:392959821616:web:89f2650762fdfecccd6af5"

};


const firebaseApp =
  initializeApp(firebaseConfig);


const auth =
  getAuth(firebaseApp);


let db;


try {

  db =
    initializeFirestore(
      firebaseApp,
      {
        localCache:
          persistentLocalCache({
            tabManager:
              persistentMultipleTabManager()
          })
      }
    );

} catch(e) {

  db =
    getFirestore(firebaseApp);

}


/* =========================================================
   ESTADO
========================================================= */

let firebaseUser = null;

let employees = [];

let currentEmployee = null;

let selectedEmployee = null;

let pin = "";

let page = "home";

let savingSale = false;


let sale = {

  grams: "",

  payment: "Efectivo",

  received: "",

  status: "draft"

};


let settings = {

  pricePerGram: 0.40,

  businessName: "Nüvy Villa Juárez"

};


let sales = [];

let inventory = [];

let cashClosings = [];


/* =========================================================
   UTILIDADES
========================================================= */

const $ =
  id => document.getElementById(id);


function money(n) {

  return "$" +
    Number(n || 0).toFixed(2);

}


function today() {

  return new Date()
    .toLocaleDateString("en-CA");

}


function timeNow() {

  return new Date()
    .toLocaleTimeString(
      "es-MX",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

}


function uid(prefix) {

  return prefix +
    "-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2,7);

}


function toast(message) {

  $("toast").textContent =
    message;

  $("toast")
    .classList
    .add("show");

  setTimeout(() => {

    $("toast")
      .classList
      .remove("show");

  },2200);

}


function isOwner() {

  return currentEmployee?.role === "Owner";

}


function requireOwner() {

  if(!isOwner()) {

    toast(
      "Solo Owner puede hacer esto"
    );

    return false;

  }

  return true;

}


function updateCloudStatus() {

  const el =
    $("cloudStatus");

  if(!el)return;

  if(navigator.onLine) {

    el.textContent =
      "☁️ Firebase conectado";

    el.className =
      "cloud";

  } else {

    el.textContent =
      "📴 Sin internet · sincronización pendiente";

    el.className =
      "cloud off";

  }

}


/* =========================================================
   AUTH FIREBASE
========================================================= */

async function ensureAnonymousAuth() {

  if(auth.currentUser) {

    firebaseUser =
      auth.currentUser;

    return firebaseUser;

  }

  const result =
    await signInAnonymously(auth);

  firebaseUser =
    result.user;

  return firebaseUser;

}


onAuthStateChanged(
  auth,
  user => {

    firebaseUser =
      user;

    updateCloudStatus();

  }
);


/* =========================================================
   CARGAR FIREBASE
========================================================= */

async function loadData() {

  updateCloudStatus();

  try {

    await ensureAnonymousAuth();


    /* SETTINGS */

    const settingsSnap =
      await getDoc(
        doc(
          db,
          "settings",
          "main"
        )
      );


    if(settingsSnap.exists()) {

      settings = {

        ...settings,

        ...settingsSnap.data()

      };

    } else {

      await setDoc(
        doc(
          db,
          "settings",
          "main"
        ),
        settings
      );

    }


    /* EMPLEADOS */

    const empSnap =
      await getDocs(
        collection(
          db,
          "employees"
        )
      );


    employees =
      empSnap.docs.map(
        d => ({
          id:d.id,
          ...d.data()
        })
      );


    /*
      Si todavía no existe ningún empleado,
      creamos únicamente los Owners.
    */

    if(!employees.length) {

      const owners = [

        {
          id:
            "gIFnxX5HyPhlX6FhpqBcvtGM6RW2",

          name:
            "Ramón",

          email:
            "owner@nuvy.com.mx",

          role:
            "Owner",

          pin:
            "",

          active:
            true

        },

        {
          id:
            "pB4535a31SQtaCgYCrRnnUpb5Hs1",

          name:
            "Itzel",

          email:
            "itzel@nuvy.com.mx",

          role:
            "Owner",

          pin:
            "",

          active:
            true

        }

      ];


      for(
        const employee of owners
      ) {

        await setDoc(
          doc(
            db,
            "employees",
            employee.id
          ),
          employee
        );

      }


      employees =
        owners;

    }


    /* VENTAS */

    try {

      const salesSnap =
        await getDocs(
          query(
            collection(
              db,
              "sales"
            ),
            orderBy(
              "createdAt",
              "desc"
            )
          )
        );


      sales =
        salesSnap.docs.map(
          d => ({
            id:d.id,
            ...d.data()
          })
        );

    } catch(e) {

      const salesSnap =
        await getDocs(
          collection(
            db,
            "sales"
          )
        );


      sales =
        salesSnap.docs.map(
          d => ({
            id:d.id,
            ...d.data()
          })
        );

    }


    /* INVENTARIO */

    const invSnap =
      await getDocs(
        collection(
          db,
          "inventory"
        )
      );


    inventory =
      invSnap.docs.map(
        d => ({
          id:d.id,
          ...d.data()
        })
      );


    /* CORTES */

    const cashSnap =
      await getDocs(
        collection(
          db,
          "cashClosings"
        )
      );


    cashClosings =
      cashSnap.docs.map(
        d => ({
          id:d.id,
          ...d.data()
        })
      );


    renderEmployees();


  } catch(error) {

    console.error(
      "Firebase:",
      error
    );

    updateCloudStatus();

    toast(
      "No se pudo sincronizar Firebase"
    );

    renderEmployees();

  }

}


/* =========================================================
   GUARDAR
========================================================= */

async function saveSaleRemote(saleData) {

  try {

    await setDoc(
      doc(
        db,
        "sales",
        saleData.id
      ),
      saleData
    );

    return true;

  } catch(error) {

    console.error(
      "Venta Firebase:",
      error
    );

    return false;

  }

}


async function saveEmployee(employee) {

  try {

    await setDoc(
      doc(
        db,
        "employees",
        employee.id
      ),
      employee
    );

    return true;

  } catch(error) {

    console.error(
      error
    );

    toast(
      "No se pudo guardar empleado"
    );

    return false;

  }

}


async function saveInventoryItem(item) {

  try {

    await setDoc(
      doc(
        db,
        "inventory",
        item.id
      ),
      item
    );

    return true;

  } catch(error) {

    console.error(error);

    toast(
      "No se pudo guardar inventario"
    );

    return false;

  }

}


async function saveSettings() {

  try {

    await setDoc(
      doc(
        db,
        "settings",
        "main"
      ),
      settings
    );

    return true;

  } catch(error) {

    console.error(error);

    toast(
      "No se pudo guardar configuración"
    );

    return false;

  }

}


/* =========================================================
   LOGIN / PIN
========================================================= */

function renderEmployees() {

  const box =
    $("employeeSelect");

  const active =
    employees.filter(
      e => e.active !== false
    );


  if(!active.length) {

    box.innerHTML =
      `<div style="
        grid-column:1/-1;
        padding:20px;
        color:#8c858c;
        font-size:13px">
        No hay empleados configurados.
      </div>`;

    return;

  }


  box.innerHTML =
    active.map(
      e => `

      <button
        class="emp ${
          selectedEmployee?.id === e.id
            ? "active"
            : ""
        }"
        onclick="selectEmployee('${e.id}')">

        <b>${e.name}</b><br>

        <small>
          ${e.role}
        </small>

      </button>

      `
    ).join("");

}


window.selectEmployee =
id => {

  selectedEmployee =
    employees.find(
      e => e.id === id
    );

  pin = "";

  updatePin();

  renderEmployees();

};


window.pressPin =
number => {

  if(!selectedEmployee) {

    toast(
      "Selecciona quién está cobrando"
    );

    return;

  }


  if(pin.length < 6) {

    pin += String(number);

    updatePin();

  }

};


window.backPin =
() => {

  pin =
    pin.slice(0,-1);

  updatePin();

};


function updatePin() {

  $("pinDots")
    .textContent =
      pin.length
        ? Array
            .from(pin)
            .map(()=>"●")
            .join(" ")
        : "○ ○ ○ ○";

}


window.login = () => {

  if(!selectedEmployee) {

    toast(
      "Selecciona un empleado"
    );

    return;

  }


  if(!selectedEmployee.pin) {

    return openCreatePin();

  }


  if(
    pin ===
    String(selectedEmployee.pin)
  ) {

    enterApp();

  } else {

    pin = "";

    updatePin();

    toast(
      "PIN incorrecto"
    );

  }

};


function enterApp() {

  currentEmployee =
    selectedEmployee;

  $("login")
    .classList
    .add("hidden");

  $("app")
    .classList
    .remove("hidden");

  $("currentEmployee")
    .textContent =
      currentEmployee.name;

  page =
    "home";

  render();

}


function openCreatePin() {

  $("modalBox").innerHTML = `

    <h2>
      Crear PIN
    </h2>

    <p class="subtitle">
      Este PIN será utilizado para entrar a NÜVY.
    </p>

    <label>
      PIN de 4 a 6 números
    </label>

    <input
      id="newPin"
      type="password"
      inputmode="numeric"
      maxlength="6"
      placeholder="••••"
    >

    <br><br>

    <button
      class="primary"
      onclick="saveNewPin()">

      GUARDAR PIN

    </button>

  `;

  openModal();

}


window.saveNewPin =
async() => {

  const value =
    $("newPin")
      .value
      .trim();


  if(!/^\d{4,6}$/.test(value)) {

    toast(
      "El PIN debe tener 4 a 6 números"
    );

    return;

  }


  selectedEmployee.pin =
    value;


  if(
    !await saveEmployee(
      selectedEmployee
    )
  )return;


  closeModal();

  pin = "";

  updatePin();

  toast(
    "PIN creado"
  );

};


window.switchEmployee =
() => {

  currentEmployee =
    null;

  selectedEmployee =
    null;

  pin = "";

  updatePin();

  $("app")
    .classList
    .add("hidden");

  $("login")
    .classList
    .remove("hidden");

  renderEmployees();

};


/* =========================================================
   NAVEGACIÓN
========================================================= */

window.go =
(pageName,button) => {

  page =
    pageName;


  document
    .querySelectorAll(".nav")
    .forEach(
      x =>
        x.classList
          .remove("active")
    );


  if(button) {

    button.classList
      .add("active");

  }


  render();

};


function render() {

  if(page==="home")
    home();

  if(page==="sale")
    salePage();

/* =========================================================
   ACTUALIZAR VENTA
========================================================= */

function updateSaleDisplay() {

  const grams =
    Number(sale.grams) || 0;


  const total =
    grams *
    Number(
      settings.pricePerGram || 0
    );


  if($("weightDisplay")) {

    $("weightDisplay")
      .textContent =
        grams;

  }


  if($("saleTotal")) {

    $("saleTotal")
      .textContent =
        money(total);

  }


  if($("chargeButton")) {

    $("chargeButton")
      .textContent =
        "COBRAR " +
        money(total);

  }


  if(
    sale.payment === "Efectivo" &&
    $("cashReceived")
  ) {

    updateReceived(
      $("cashReceived").value
    );

  }

}


window.updateReceived =
value => {

  sale.received =
    value;


  const total =
    (Number(sale.grams) || 0) *
    Number(
      settings.pricePerGram || 0
    );


  const received =
    Number(value) || 0;


  const difference =
    received - total;


  const box =
    $("changeBox");


  if(!box)return;


  box.innerHTML = `

    <div>

      ${
        received >= total
          ? "Feria a devolver"
          : "Falta por pagar"
      }

    </div>


    <strong>

      ${
        received >= total
          ? money(difference)
          : money(total-received)
      }

    </strong>

  `;

};


window.setPayment =
payment => {

  sale.payment =
    payment;


  if(payment !== "Efectivo") {

    sale.received = "";

  }


  salePage();

};


/* =========================================================
   COBRAR
========================================================= */

window.chargeSale =
async() => {

  if(savingSale)return;


  if(!currentEmployee) {

    toast(
      "No hay empleado activo"
    );

    return;

  }


  const grams =
    Number(sale.grams) || 0;


  if(grams <= 0) {

    toast(
      "Introduce el peso"
    );

    return;

  }


  const total =
    grams *
    Number(
      settings.pricePerGram
    );


  let received =
    total;


  let change =
    0;


  if(
    sale.payment ===
    "Efectivo"
  ) {

    received =
      Number(
        sale.received
      ) || 0;


    if(received < total) {

      toast(
        "El efectivo no alcanza"
      );

      return;

    }


    change =
      received - total;

  }


  savingSale =
    true;


  const button =
    $("chargeButton");


  if(button) {

    button.disabled =
      true;

    button.textContent =
      "GUARDANDO…";

  }


  const newSale = {

    id:
      uid("NV"),

    date:
      today(),

    time:
      timeNow(),

    grams:
      grams,

    pricePerGram:
      Number(
        settings.pricePerGram
      ),

    total:
      total,

    payment:
      sale.payment,

    received:
      received,

    change:
      change,

    employeeId:
      currentEmployee.id,

    employee:
      currentEmployee.name,

    status:
      "PAID",

    cancelled:
      false,

    createdAt:
      serverTimestamp()

  };


  /*
    Primero actualizamos la interfaz.
    Firestore utiliza su caché local
    y sincroniza cuando vuelve internet.
  */

  sales.unshift({

    ...newSale,

    createdAt:
      new Date().toISOString()

  });


  sale = {

    grams: "",

    payment: "Efectivo",

    received: "",

    status: "draft"

  };


  savingSale =
    false;


  toast(
    "Venta cobrada ✓"
  );


  go("home");


  /*
    Firebase se encarga de sincronizar.
  */

  saveSaleRemote(
    newSale
  )
  .then(
    ok => {

      if(!ok) {

        toast(
          "Venta pendiente de sincronización"
        );

      }

    }
  );

};

window.closeCash =
async expected => {

  if(!isOwner()) {

    toast(
      "Solo Owner puede cerrar caja"
    );

    return;

  }


  const real =
    Number(
      $("cashReal").value
    );


  if(
    !Number.isFinite(real) ||
    real < 0
  ) {

    toast(
      "Introduce el efectivo contado"
    );

    return;

  }


  const closing = {

    id:
      uid("CORTE"),

    date:
      today(),

    time:
      timeNow(),

    expected:
      Number(expected),

    real:
      real,

    difference:
      real -
      Number(expected),

    employeeId:
      currentEmployee.id,

    employee:
      currentEmployee.name,

    createdAt:
      serverTimestamp()

  };


  cashClosings.unshift(
    closing
  );


  setDoc(
    doc(
      db,
      "cashClosings",
      closing.id
    ),
    closing
  )
  .then(
    () => {

      toast(
        closing.difference === 0
          ? "Corte correcto ✓"
          : "Corte guardado"
      );

    }
  )
  .catch(
    error => {

      console.error(
        error
      );

      toast(
        "Corte pendiente de sincronización"
      );

    }
  );

};

    <input
      id="editPin"
      type="password"
      inputmode="numeric"
      maxlength="6"
      value="${employee.pin || ""}"
    >


    <label>
      Rol
    </label>

    <select id="editRole">

      <option
        value="Empleado"
        ${
          employee.role === "Empleado"
            ? "selected"
            : ""
        }>

        Empleado

      </option>


      <option
        value="Owner"
        ${
          employee.role === "Owner"
            ? "selected"
            : ""
        }>

        Owner

      </option>

    </select>


    <br><br>


    <button
      class="primary"
      onclick="updateEmployee('${id}')">

      GUARDAR CAMBIOS

    </button>


    <br><br>


    <button
      class="secondary danger"
      onclick="toggleEmployee('${id}')">

      ${
        employee.active === false
          ? "Activar empleado"
          : "Desactivar empleado"
      }

    </button>

  `;


  openModal();

};


window.updateEmployee =
async id => {

  if(!requireOwner())return;


  const employee =
    employees.find(
      x => x.id === id
    );


  if(!employee)return;


  const name =
    $("editName")
      .value
      .trim();


  const pinValue =
    $("editPin")
      .value
      .trim();


  const role =
    $("editRole")
      .value;


  if(!name) {

    toast(
      "Falta el nombre"
    );

    return;

  }


  if(
    !/^\d{4,6}$/.test(
      pinValue
    )
  ) {

    toast(
      "PIN inválido"
    );

    return;

  }


  employee.name =
    name;

  employee.pin =
    pinValue;

  employee.role =
    role;


  if(
    !await saveEmployee(
      employee
    )
  )return;


  closeModal();

  employeesPage();

  toast(
    "Empleado actualizado ✓"
  );

};


window.toggleEmployee =
async id => {

  if(!requireOwner())return;


  const employee =
    employees.find(
      x => x.id === id
    );


  if(!employee)return;


  employee.active =
    employee.active === false;


  if(
    !await saveEmployee(
      employee
    )
  )return;


  closeModal();

  employeesPage();


  toast(
    employee.active
      ? "Empleado activado"
      : "Empleado desactivado"
  );

};


/* =========================================================
   CONFIGURACIÓN
========================================================= */

function settingsPage() {

  if(!requireOwner())return;


  $("content").innerHTML = `

    <h1>
      Configuración
    </h1>


    <p class="subtitle">
      Solo Ramón e Itzel pueden modificar esto.
    </p>


    <div class="card">

      <h2>
        Precio de venta
      </h2>


      <label>
        Precio por gramo
      </label>


      <input
        id="priceGram"
        type="number"
        inputmode="decimal"
        step="0.01"
        min="0"
        value="${settings.pricePerGram}"
      >


      <p class="small-note">

        Ejemplo:
        $0.40 × 213 g = $85.20.

      </p>


      <button
        class="primary"
        onclick="savePrice()">

        GUARDAR PRECIO

      </button>

    </div>

  `;

}


window.savePrice =
async() => {

  if(!requireOwner())return;


  const value =
    Number(
      $("priceGram").value
    );


  if(
    !Number.isFinite(value) ||
    value <= 0
  ) {

    toast(
      "Precio inválido"
    );

    return;

  }


  settings.pricePerGram =
    value;


  if(
    !await saveSettings()
  )return;


  toast(
    "Precio actualizado ✓"
  );

};


/* =========================================================
   MODAL
========================================================= */

function openModal() {

  $("modal")
    .classList
    .add("show");

}


window.closeModal =
() => {

  $("modal")
    .classList
    .remove("show");

};


/* =========================================================
   INTERNET
========================================================= */

window.addEventListener(
  "online",
  () => {

    updateCloudStatus();

    toast(
      "Internet conectado ✓"
    );

    loadData();

  }
);


window.addEventListener(
  "offline",
  () => {

    updateCloudStatus();

    toast(
      "Sin internet · Nüvy continúa"
    );

  }
);


/* =========================================================
   ARRANQUE
========================================================= */

(async() => {

  updateCloudStatus();


  try {

    await ensureAnonymousAuth();

  } catch(error) {

    console.error(
      "Firebase Auth:",
      error
    );

    toast(
      "No se pudo conectar con Firebase"
    );

  }


  await loadData();


  renderEmployees();

})();

</script>

</body>
